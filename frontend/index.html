<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-Marketer Platform OS v4.0 | Multi-Tenant</title>
</head>

<body class="bg-[var(--bg-color)] text-[var(--text-color)]">
  <div id="app" class="flex min-h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-[var(--bg-secondary)] border-r border-[var(--border-color)] flex flex-col">
      <div class="p-6">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-600 bg-clip-text text-transparent">
          AI-Marketer</h1>
        <p class="text-xs text-gray-400">PLATFORM OS V4.0 | MULTI-TENANT</p>
      </div>

      <!-- Company Branding Area (dynamic) -->
      <div id="sidebar-brand" class="px-4"></div>

      <nav id="nav-links" class="flex-1 px-4 space-y-2 mt-2 overflow-y-auto">
        <!-- Dynamic Links based on role -->
      </nav>

    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col">
      <!-- Header -->
      <header
        class="h-16 flex items-center justify-between px-8 border-b border-[var(--border-color)] bg-[var(--bg-color)]/80 backdrop-blur-md sticky top-0 z-10">
        <div id="page-title" class="flex items-center space-x-2">
          <span class="text-xs tracking-widest text-cyan-400 font-semibold uppercase">AI PLATFORM OS V4.0</span>
          <span class="text-gray-600">/</span>
          <span id="current-page-name" class="font-bold text-xl uppercase tracking-wider">OBJECTIVE</span>
        </div>

        <div class="flex items-center space-x-6">
          <!-- Theme Switcher -->
          <div
            class="flex items-center space-x-2 bg-[var(--card-bg)] p-1 rounded-xl border border-[var(--border-color)]">
            <button id="theme-dark"
              class="w-8 h-8 rounded-lg flex items-center justify-center transition-all hover:bg-white/5 active:scale-90"
              title="Dark Mode">🌑</button>
            <button id="theme-light"
              class="w-8 h-8 rounded-lg flex items-center justify-center transition-all hover:bg-white/5 active:scale-90"
              title="Light Mode">☀️</button>
            <button id="theme-blue"
              class="w-8 h-8 rounded-lg flex items-center justify-center transition-all hover:bg-white/5 active:scale-90"
              title="Blue Mode">🫐</button>
            <button id="theme-red"
              class="w-8 h-8 rounded-lg flex items-center justify-center transition-all hover:bg-white/5 active:scale-90"
              title="Red Mode">❤️</button>
            <button id="theme-windo"
              class="w-8 h-8 rounded-lg flex items-center justify-center transition-all hover:bg-white/5 active:scale-90"
              title="Windows Mode">🪟</button>
          </div>

          <!-- Notification Bell with Badge -->
          <button onclick="switchScreen('Notifications')" class="relative p-2 text-gray-400 hover:text-white transition-colors cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span id="notif-badge" class="hidden absolute -top-0 -right-0 min-w-[18px] h-[18px] bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center px-1">0</span>
          </button>

          <!-- Role Switcher -->
          <div class="relative group">
            <button id="role-switcher-btn"
              class="flex items-center space-x-3 bg-[var(--card-bg)] px-4 py-2 rounded-xl border border-[var(--border-color)] hover:border-cyan-500 transition-all cursor-pointer">
              <div class="text-right">
                <p class="text-[10px] text-gray-400 uppercase tracking-tighter">Identity</p>
                <p id="active-role-display" class="text-sm font-bold">Marketing Expert</p>
              </div>
              <div id="active-role-icon"
                class="w-8 h-8 rounded-full bg-cyan-900/50 flex items-center justify-center text-cyan-400 font-bold border border-cyan-500/30">
                E
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Role Switcher Dropdown -->
            <div id="role-dropdown"
              class="absolute right-0 mt-2 w-56 bg-[var(--card-bg)] border border-[var(--border-color)] rounded-xl shadow-2xl hidden z-20 overflow-hidden">
              <div class="p-2">
                <button
                  id="dropdown-logout-btn"
                  class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-red-500/10 hover:text-red-400 transition-all text-left text-gray-400">
                  <span
                    class="w-8 h-8 rounded-full bg-red-900/50 flex items-center justify-center text-red-400 font-bold">↩</span>
                  <span>Logout</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Dynamic Content Area -->
      <div id="content-container"
        class="flex-1 overflow-y-auto p-8 bg-gradient-to-br from-[var(--bg-color)] via-[var(--bg-secondary)] to-[var(--bg-color)]">
        <!-- Content injected via main.js -->
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
